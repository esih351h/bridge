          package com.example.bridgehelper

          import android.content.Context
          import android.content.SharedPreferences
          import android.provider.Settings

          /** Every setting lives here, together with its default (used by "Reset to default"). */
          object Prefs {
              /** tab: "general" = used by both ways of playing, "manual" = you hold, "auto" = the app holds. */
              class Opt(val key: String, val title: String, val desc: String, val def: Float, val tab: String)

              val BRIDGE = listOf(
                  Opt("lead", "Reaction lead (ms)", "How early the release cue comes. Manual play uses it for the cue; auto uses it only when Fixed-length hold is off. It also adjusts itself after every release.", 100f, "general"),
                  Opt("aim", "Aim point on the platform", "Used only when the blue dot is not found. 0 = near edge, 0.5 = middle, 1 = far edge.", 0.5f, "general"),
                  Opt("rateEst", "Pole growth speed", "How fast the pole grows, in capture pixels per second. Learned automatically.", 295f, "general"),
                  Opt("beat", "Countdown beat spacing (ms)", "Three beeps, then release on the 4th. 0 turns the beeps off.", 150f, "manual"),
                  Opt("holdWait", "Wait before each hold (seconds)", "After a new platform appears, wait this long before holding again. 0 = hold at once, up to 60. Counts down in the status line as hold in ...s.", 10f, "auto"),
                  Opt("timedAdj", "Hold time adjust (ms)", "+ if bridges come out short, - if too long. It learns by itself from where each bridge lands.", 0f, "auto"),
                  Opt("pressX", "Press position X (%)", "Where auto presses, as a percent from the left of the screen.", 52f, "auto"),
                  Opt("pressY", "Press position Y (%)", "Percent from the top. The default is the middle of the sky, below the reward bar.", 45f, "auto")
              )

              val TOWER = listOf(
                  Opt("tFightWait", "Wait after Fight (ms)", "Pause before the next tap once Fight was pressed.", 2500f, "auto"),
                  Opt("tSkipWait", "Wait after Skip (ms)", "Pause after Skip. Keep it long: the same spot is the Daily Ranking icon on the Tower screen.", 2500f, "auto"),
                  Opt("tOkWait", "Wait after OK (ms)", "Pause after OK on the reward box.", 1500f, "auto"),
                  Opt("tStuck", "Stop after repeated taps", "If the same button is tapped this many times and nothing changes, auto turns itself off.", 3f, "auto")
              )

              fun of(c: Context): SharedPreferences = c.getSharedPreferences("p", Context.MODE_PRIVATE)

              fun resetBridge(c: Context) {
                  val e = of(c).edit()
                  BRIDGE.forEach { e.remove(it.key) }
                  e.remove("auto_bridge"); e.remove("timedAlways"); e.apply()
              }

              fun resetTower(c: Context) {
                  val e = of(c).edit()
                  TOWER.forEach { e.remove(it.key) }
                  e.remove("auto_tower"); e.apply()
              }

              fun fmt(v: Float): String = if (v == v.toInt().toFloat()) v.toInt().toString() else v.toString()

              /** Is the OL Helper accessibility service switched on in Android settings? */
              fun accessibilityOn(c: Context): Boolean {
                  val s = Settings.Secure.getString(c.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
                  return s.split(':').any { it.startsWith(c.packageName + "/") }
              }

              /** The two things OL Helper cannot run without. */
              fun coreMissing(c: Context): List<String> {
                  val l = ArrayList<String>()
                  if (!Settings.canDrawOverlays(c)) l.add("overlay permission")
                  if (!accessibilityOn(c)) l.add("accessibility service")
                  return l
              }
          }
