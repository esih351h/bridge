name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p "$(dirname settings.gradle.kts)"
          cat > settings.gradle.kts <<'BH_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "BridgeHelper"
          include(":app")
          BH_EOF
          mkdir -p "$(dirname build.gradle.kts)"
          cat > build.gradle.kts <<'BH_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          BH_EOF
          mkdir -p "$(dirname app/build.gradle.kts)"
          cat > app/build.gradle.kts <<'BH_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.bridgehelper"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.bridgehelper"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          BH_EOF
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'BH_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application android:label="Bridge Helper" android:theme="@android:style/Theme.Material.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".OverlayService" android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          BH_EOF
          mkdir -p "$(dirname app/src/main/java/com/example/bridgehelper/MainActivity.kt)"
          cat > app/src/main/java/com/example/bridgehelper/MainActivity.kt <<'BH_EOF'
          package com.example.bridgehelper

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.ViewGroup.LayoutParams.MATCH_PARENT
          import android.view.ViewGroup.LayoutParams.WRAP_CONTENT
          import android.widget.*

          class MainActivity : Activity() {
              private lateinit var lead: EditText
              private lateinit var aim: EditText
              private lateinit var statusView: TextView

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  if (Build.VERSION.SDK_INT >= 33)
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  val prefs = getSharedPreferences("p", MODE_PRIVATE)
                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(pad, pad, pad, pad) }
                  fun tv(t: String) = TextView(this).apply { text = t; setPadding(0, pad / 2, 0, pad / 2) }
                  fun num(v: Float) = EditText(this).apply {
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL; setText(v.toString())
                  }
                  fun btn(t: String, f: () -> Unit) = Button(this).apply { text = t; setOnClickListener { f() } }

                  root.addView(tv("Reaction lead (ms): the phone cues you this much earlier to cover capture + reaction delay. " +
                      "If you release too late, raise it; too early, lower it."))
                  lead = num(prefs.getFloat("lead", 100f)); root.addView(lead, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT))
                  root.addView(tv("Aim point on the next platform, 0.0 = near edge, 0.5 = middle, 1.0 = far edge."))
                  aim = num(prefs.getFloat("aim", 0.5f)); root.addView(aim, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT))

                  root.addView(btn("1. Grant overlay permission") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  })
                  root.addView(btn("2. Start auto-detect") {
                      if (!Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Grant overlay permission first", Toast.LENGTH_SHORT).show(); return@btn
                      }
                      prefs.edit().putFloat("lead", lead.text.toString().toFloatOrNull() ?: 100f)
                          .putFloat("aim", aim.text.toString().toFloatOrNull() ?: 0.5f).apply()
                      val mpm = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      startActivityForResult(mpm.createScreenCaptureIntent(), 100)
                  })
                  root.addView(btn("Stop") { stopService(Intent(this, OverlayService::class.java)) })
                  root.addView(tv("Status (also shown in the notification while it runs):"))
                  statusView = TextView(this).apply { text = prefs.getString("status", "not started") }
                  root.addView(statusView)
                  root.addView(btn("Refresh status") { showStatus() })
                  root.addView(tv("Choose \"Entire screen\" if asked what to share. Then open the game. The app finds the platforms, " +
                      "marks the landing zone, vibrates when to let go, and shows RELEASE / TOO LONG on screen."))
                  setContentView(ScrollView(this).apply { addView(root) })
              }

              override fun onResume() { super.onResume(); showStatus() }

              private fun showStatus() {
                  statusView.text = getSharedPreferences("p", MODE_PRIVATE).getString("status", "not started")
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req == 100 && res == RESULT_OK && data != null) {
                      startForegroundService(Intent(this, OverlayService::class.java)
                          .putExtra("code", res).putExtra("data", data))
                  }
              }
          }
          BH_EOF
          mkdir -p "$(dirname app/src/main/java/com/example/bridgehelper/OverlayService.kt)"
          cat > app/src/main/java/com/example/bridgehelper/OverlayService.kt <<'BH_EOF'
          package com.example.bridgehelper

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.content.res.Configuration
          import android.graphics.*
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.Image
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.util.DisplayMetrics
          import android.view.*
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          /** phase: 0 idle, 1 holding, 2 release now, 3 too long */
          class GuideState(
              val ok: Boolean, val ytop: Float = 0f, val baseX: Float = 0f, val winLo: Float = 0f,
              val winHi: Float = 0f, val aim: Float = 0f, val len: Float = 0f, val phase: Int = 0,
              val capW: Int = 1, val debug: String = ""
          )

          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private var projection: MediaProjection? = null
              private var vd: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private lateinit var ht: HandlerThread
              private lateinit var bg: Handler
              private val ui = Handler(Looper.getMainLooper())
              private var guide: GuideView? = null
              @Volatile private var frames = 0
              private lateinit var nb: Notification.Builder
              private var lastStatusT = 0L
              @Volatile private var swap = false   // some devices deliver red/blue swapped
              private var capW = 1; private var capH = 1
              private var leadMs = 100f; private var aimFrac = 0.5f

              // geometry smoothing / freezing while the pole grows
              private val hist = ArrayList<FloatArray>()
              private var fValid = false; private var fTop = 0; private var fBase = 0
              private var fGap = 0f; private var fPw = 0f; private var fW = 1; private var fAim = 0f
              // pole growth samples
              private val tsN = ArrayList<Float>(); private val lsN = ArrayList<Float>()
              private var t0 = 0L; private var cued = false

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
              }

              @Suppress("DEPRECATION")
              private fun dataExtra(i: Intent): Intent? =
                  if (Build.VERSION.SDK_INT >= 33) i.getParcelableExtra("data", Intent::class.java)
                  else i.getParcelableExtra("data")

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  if (i == null || projection != null) return START_NOT_STICKY
                  val ch = "ov"
                  (getSystemService(NOTIFICATION_SERVICE) as NotificationManager)
                      .createNotificationChannel(NotificationChannel(ch, "Overlay", NotificationManager.IMPORTANCE_LOW))
                  nb = Notification.Builder(this, ch).setContentTitle("Bridge Helper running")
                      .setContentText("starting…").setSmallIcon(android.R.drawable.ic_menu_compass)
                  if (Build.VERSION.SDK_INT >= 29)
                      startForeground(1, nb.build(), ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  else startForeground(1, nb.build())
                  try {

                  val prefs = getSharedPreferences("p", MODE_PRIVATE)
                  leadMs = prefs.getFloat("lead", 100f); aimFrac = prefs.getFloat("aim", 0.5f).coerceIn(0f, 1f)

                  ht = HandlerThread("cap").also { it.start() }; bg = Handler(ht.looper)
                  val mpm = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val data = dataExtra(i) ?: run { stopSelf(); return START_NOT_STICKY }
                  projection = mpm.getMediaProjection(i.getIntExtra("code", 0), data)
                  projection!!.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { status("capture was stopped by the system or another app", true); stopSelf() }
                  }, bg)

                  guide = GuideView(this).also {
                      wm.addView(it, WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT))
                  }
                  reader = buildReader()
                  vd = projection!!.createVirtualDisplay("cap", capW, capH, resources.displayMetrics.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader!!.surface, null, bg)
                  status("capture started %dx%d".format(capW, capH), true)
                  } catch (e: Exception) {
                      status("start failed: ${e.javaClass.simpleName} ${e.message}", true)
                      ui.post { android.widget.Toast.makeText(this, "Start failed: ${e.message}", android.widget.Toast.LENGTH_LONG).show() }
                      stopSelf()
                  }
                  return START_NOT_STICKY
              }

              /** Shows the latest state in the notification and in the app, so it can be read without any overlay. */
              private fun status(text: String, force: Boolean = false) {
                  val now = SystemClock.elapsedRealtime()
                  if (!force && now - lastStatusT < 1000) return
                  lastStatusT = now
                  getSharedPreferences("p", MODE_PRIVATE).edit().putString("status", text).apply()
                  (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).notify(1, nb.setContentText(text).build())
              }

              @Suppress("DEPRECATION")
              private fun screenSize(): Pair<Int, Int> {
                  val dm = getSystemService(Context.DISPLAY_SERVICE) as DisplayManager
                  val m = DisplayMetrics()
                  dm.getDisplay(Display.DEFAULT_DISPLAY).getRealMetrics(m)
                  return m.widthPixels to m.heightPixels
              }

              private fun buildReader(): ImageReader {
                  val (sw, sh) = screenSize()
                  val long = max(sw, sh); val short = min(sw, sh)   // the game is landscape
                  capW = min(long, 640); capH = short * capW / long
                  val r = ImageReader.newInstance(capW, capH, PixelFormat.RGBA_8888, 2)
                  r.setOnImageAvailableListener({ rd ->
                      val img = rd.acquireLatestImage()
                      if (img != null) {
                          try { frames++; analyze(img) }
                          catch (e: Exception) { publish(GuideState(false, debug = "error: ${e.javaClass.simpleName} ${e.message}")) }
                          finally { img.close() }
                      }
                  }, bg)
                  return r
              }

              // ---------- detection ----------
              private fun analyze(img: Image) {
                  val W = img.width; val H = img.height
                  val pl = img.planes[0]; val buf = pl.buffer; val rs = pl.rowStride
                  fun r(x: Int, y: Int) = buf.get(y * rs + x * 4 + (if (swap) 2 else 0)).toInt() and 255
                  fun g(x: Int, y: Int) = buf.get(y * rs + x * 4 + 1).toInt() and 255
                  fun b(x: Int, y: Int) = buf.get(y * rs + x * 4 + (if (swap) 0 else 2)).toInt() and 255
                  fun teal(x: Int, y: Int): Boolean {
                      val rr = r(x, y); val gg = g(x, y); val bb = b(x, y)
                      return rr < 90 && gg in 95..190 && bb in 100..210 && gg > rr + 60 && abs(gg - bb) < 50
                  }
                  fun stone(x: Int, y: Int): Boolean {
                      val rr = r(x, y); val gg = g(x, y); val bb = b(x, y)
                      val mx = max(rr, max(gg, bb)); val mn = min(rr, min(gg, bb))
                      return mx in 30..175 && mx - mn < 60 && !teal(x, y)
                  }
                  fun pole(x: Int, y: Int): Boolean {
                      val rr = r(x, y); val gg = g(x, y); val bb = b(x, y)
                      return rr < 45 && gg in 85..130 && bb in 180..225
                  }
                  // current pole length: vertical run of pole-blue above the left platform's edge
                  fun measure(ytop: Int, base: Int): Float {
                      val x0 = max(0, base - (W * 0.006f).toInt()); val x1 = min(W - 1, base + (W * 0.016f).toInt())
                      val yMin = max(0, ytop - (W * 0.40f).toInt()); val yStart = ytop - max(3, (W * 0.006f).toInt())
                      val gapTol = max(3, (W * 0.008f).toInt())
                      var lastHit = yStart; var y = yStart
                      while (y >= yMin) {
                          var hit = false; var x = x0
                          while (x <= x1) { if (pole(x, y)) { hit = true; break }; x++ }
                          if (hit) lastHit = y else if (lastHit - y > gapTol) break
                          y--
                      }
                      return (ytop - lastHit).toFloat()
                  }
                  val minLen = max(10f, W * 0.015f)

                  // While a pole is growing, keep the geometry measured just before it started.
                  if (fValid) {
                      val len = measure(fTop, fBase)
                      if (len > minLen) { hold(img.timestamp, len); return }
                      fValid = false; resetHold()
                  }

                  // 1) platform top = first row with lots of teal
                  val thr = max(4, (W * 0.015f).toInt()); val need = max(3, (W * 0.005f).toInt())
                  var ytop = -1; var best = 0; var bestY = 0; var streak = 0
                  for (y in (H * 0.30f).toInt() until (H * 0.98f).toInt()) {
                      var c = 0; var x = 0
                      while (x < W) { if (teal(x, y)) c++; x += 2 }
                      if (c > best) { best = c; bestY = y }
                      if (c >= thr) { streak++; if (streak >= need) { ytop = y - need + 1; break } } else streak = 0
                  }
                  if (ytop < 0) {
                      hist.clear()
                      // average colour of a sample grid (tells us if the capture is black)
                      var sr = 0L; var sg = 0L; var sb = 0L; var n = 0
                      for (yy in 0 until 8) for (xx in 0 until 16) {
                          val px = (W * (xx + 0.5f) / 16).toInt(); val py = (H * (yy + 0.5f) / 8).toInt()
                          sr += r(px, py); sg += g(px, py); sb += b(px, py); n++
                      }
                      val black = sr + sg + sb < n * 12L
                      // would the platforms show up if red and blue were swapped?
                      var altHit = false
                      for (y in (H * 0.30f).toInt() until (H * 0.98f).toInt()) {
                          var c = 0; var x = 0
                          while (x < W) {
                              val rr = b(x, y); val gg = g(x, y); val bb = r(x, y)
                              if (rr < 90 && gg in 95..190 && bb in 100..210 && gg > rr + 60 && abs(gg - bb) < 50) c++
                              x += 2
                          }
                          if (c >= thr) { altHit = true; break }
                      }
                      if (altHit) swap = !swap
                      val note = when { black -> "BLACK capture"; altHit -> "swapped colours, retrying"; else -> "no platforms" }
                      publish(GuideState(false, debug = "%s %dx%d best=%d avg=(%d,%d,%d)".format(
                          note, W, H, best, sr / n, sg / n, sb / n)))
                      return
                  }

                  // 2) stone runs just below the top edge -> platform extents
                  val sy = min(H - 1, (ytop + W * 0.025f).toInt())
                  val tol = max(2, (W * 0.004f).toInt())
                  val runs = mutableListOf<IntArray>()
                  var s = -1; var last = -1
                  for (x in 0 until W) {
                      if (stone(x, sy)) { if (s < 0) s = x; last = x }
                      else if (s >= 0 && x - last > tol) { runs.add(intArrayOf(s, last)); s = -1 }
                  }
                  if (s >= 0) runs.add(intArrayOf(s, last))
                  val wide = runs.filter { it[1] - it[0] >= max(4f, W * 0.008f) }
                  if (wide.size < 2) { hist.clear(); publish(GuideState(false, debug = "need 2 platforms: runs=%d row=%d %dx%d".format(wide.size, sy, W, H))); return }
                  val left = wide[0]; val right = wide[1]
                  val gap = (right[0] - left[1]).toFloat(); val pw = (right[1] - right[0]).toFloat()
                  if (gap < W * 0.02f) { hist.clear(); publish(GuideState(false, debug = "gap too small")); return }

                  // 2b) the small blue "perfect landing" dot on top of the next platform
                  var sx = 0L; var cnt = 0
                  for (y in max(0, ytop - 1)..min(H - 1, ytop + max(4, (W * 0.012f).toInt())))
                      for (x in right[0]..right[1])
                          if (b(x, y) > g(x, y) + 35 && b(x, y) >= 140 && r(x, y) < 90) { sx += x; cnt++ }
                  val dotRel = if (cnt in 2..40) sx.toFloat() / cnt - left[1] - W * 0.004f else -1f

                  // 3) average the last few readings (reset if the scene jumped, e.g. scrolling)
                  if (hist.isNotEmpty() && abs(gap - hist.last()[0]) > W * 0.03f) hist.clear()
                  hist.add(floatArrayOf(gap, pw, left[1].toFloat(), ytop.toFloat(), dotRel))
                  if (hist.size > 5) hist.removeAt(0)
                  val m = FloatArray(5) { k ->
                      val v = if (k == 4) hist.map { it[4] }.filter { it > 0f } else hist.map { it[k] }
                      if (v.isEmpty()) -1f else v.average().toFloat()
                  }
                  val aimNow = chooseAim(m)

                  val len = measure(m[3].toInt(), m[2].toInt())
                  if (len > minLen) {
                      fValid = true; fGap = m[0]; fPw = m[1]; fBase = m[2].toInt(); fTop = m[3].toInt(); fW = W; fAim = aimNow
                      hold(img.timestamp, len); return
                  }
                  resetHold()
                  publish(GuideState(true, m[3], m[2], m[0] + 0.2f * m[1], m[0] + 0.8f * m[1], aimNow, 0f, 0, W,
                      "gap=%.0f w=%.0f dot=%s".format(m[0], m[1], if (m[4] > 0f) "yes" else "no")))
              }

              /** Aim at the blue dot when it was seen and looks sane, else at aimFrac across the platform. */
              private fun chooseAim(m: FloatArray): Float =
                  if (m[4] > m[0] && m[4] < m[0] + m[1]) m[4] else m[0] + aimFrac * m[1]

              private fun resetHold() { tsN.clear(); lsN.clear(); cued = false }

              /** Called for every frame while the pole is growing. */
              private fun hold(ts: Long, len: Float) {
                  val aim = fAim
                  val lo = fGap + 0.2f * fPw; val hi = fGap + 0.8f * fPw
                  if (tsN.isEmpty()) t0 = ts
                  tsN.add((ts - t0) / 1e9f); lsN.add(len)
                  if (tsN.size > 8) { tsN.removeAt(0); lsN.removeAt(0) }
                  // growth rate = slope of a straight-line fit through the recent (time, length) samples
                  var rate = 0f
                  if (tsN.size >= 3) {
                      val mt = tsN.average().toFloat(); val ml = lsN.average().toFloat()
                      var num = 0f; var den = 0f
                      for (k in tsN.indices) { num += (tsN[k] - mt) * (lsN[k] - ml); den += (tsN[k] - mt) * (tsN[k] - mt) }
                      if (den > 1e-6f) rate = num / den
                  }
                  val remaining = aim - len
                  val due = remaining <= 0f || (rate > 1f && remaining <= rate * leadMs / 1000f)
                  val phase = when { len > hi -> 3; due -> 2; else -> 1 }
                  if (phase == 2 && !cued) { cued = true; vibrate() }
                  publish(GuideState(true, fTop.toFloat(), fBase.toFloat(), lo, hi, aim, len, phase, fW,
                      "gap=%.0f w=%.0f len=%.0f rate=%.0f/s".format(fGap, fPw, len, rate)))
              }

              @Suppress("DEPRECATION")
              private fun vibrate() {
                  val v = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  if (Build.VERSION.SDK_INT >= 26) v.vibrate(VibrationEffect.createOneShot(60, 255)) else v.vibrate(60)
              }

              private fun publish(s: GuideState) { val f = frames; status("f=$f ${s.debug}"); ui.post { guide?.let { it.state = s; it.frames = f; it.invalidate() } } }

              override fun onDestroy() {
                  vd?.release(); reader?.close(); projection?.stop()
                  guide?.let { runCatching { wm.removeView(it) } }
                  if (::ht.isInitialized) ht.quitSafely()
                  super.onDestroy()
              }
          }

          class GuideView(c: Context) : View(c) {
              @Volatile var state = GuideState(false, debug = "starting")
              @Volatile var frames = 0
              private val d = resources.displayMetrics.density
              private val paint = Paint().apply { isAntiAlias = true }
              private val dbg = Paint().apply { color = Color.WHITE; textSize = 11 * d; setShadowLayer(4f, 0f, 0f, Color.BLACK) }

              override fun onDraw(cv: Canvas) {
                  val s = state; val w = width.toFloat(); val h = height.toFloat()
                  cv.drawText("f=$frames ${s.debug}", 8 * d, h - 8 * d, dbg)
                  if (!s.ok) return
                  val sc = w / s.capW

                  // One colour tells the whole story: white = idle, amber = growing, green = release now, red = too long
                  val c = when (s.phase) {
                      1 -> Color.rgb(255, 179, 0)
                      2 -> Color.rgb(0, 230, 0)
                      3 -> Color.rgb(255, 60, 60)
                      else -> Color.argb(220, 255, 255, 255)
                  }
                  fun stroke(width: Float, color: Int) { paint.style = Paint.Style.STROKE; paint.strokeWidth = width; paint.color = color }
                  fun fill(color: Int) { paint.style = Paint.Style.FILL; paint.color = color }

                  val ax = (s.baseX + s.aim) * sc          // anchor x on screen
                  val bx = s.baseX * sc                    // pole base x on screen

                  // Platform overlay right under the anchor point (below the row the detector reads)
                  val half = (s.winHi - s.winLo) / 2f
                  fill(c)
                  cv.drawRoundRect(
                      (s.baseX + s.aim - half) * sc, (s.ytop + s.capW * 0.034f) * sc,
                      (s.baseX + s.aim + half) * sc, (s.ytop + s.capW * 0.044f) * sc, 6 * d, 6 * d, paint)

                  // Reach line: the pole must be as long as base -> anchor. Thin so the pole stays visible to the detector.
                  val ly = (s.ytop - 12) * sc
                  stroke(2 * d, Color.argb(200, 255, 255, 255))
                  cv.drawLine(bx, ly, ax, ly, paint)
                  if (s.len > 0f) {
                      stroke(2 * d, c)
                      cv.drawLine(bx, ly, (s.baseX + min(s.len, s.aim)) * sc, ly, paint)
                  }
                  fill(c); cv.drawCircle(ax, ly, 7 * d, paint)

                  // Length ruler beside the pole's spawn point
                  val rx = (s.baseX + s.capW * 0.03f) * sc
                  fun yAt(v: Float) = max(0f, (s.ytop - v) * sc)
                  stroke(2 * d, Color.argb(140, 255, 255, 255))
                  cv.drawLine(rx, (s.ytop - 2) * sc, rx, yAt(s.winHi), paint)
                  stroke(4 * d, c)
                  cv.drawLine(rx, yAt(s.winLo), rx, yAt(s.winHi), paint)
                  cv.drawLine(rx - 14 * d, yAt(s.aim), rx + 14 * d, yAt(s.aim), paint)
                  if (s.len > 0f) { fill(if (s.phase == 3) Color.RED else Color.WHITE); cv.drawCircle(rx, yAt(s.len), 6 * d, paint) }

                  // Screen border flashes when it is time to release (green) or you overshot (red)
                  if (s.phase == 2 || s.phase == 3) {
                      stroke(12 * d, c)
                      cv.drawRect(0f, 0f, w, h, paint)
                  }
              }
          }
          BH_EOF
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bridge Helper build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
