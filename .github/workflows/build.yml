              private val prefs by lazy { getSharedPreferences("p", MODE_PRIVATE) }
              private val pad by lazy { (16 * resources.displayMetrics.density).toInt() }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  if (Build.VERSION.SDK_INT >= 33)
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  showHome()
              }

              private fun tv(t: String) = TextView(this).apply {
                  text = t; textSize = 15f; setPadding(0, pad / 2, 0, pad / 2)
              }
              private fun btn(t: String, f: () -> Unit) = Button(this).apply {
                  text = t; isAllCaps = false; setOnClickListener { f() }
              }
              private fun num(v: Float) = EditText(this).apply {
                  inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                  setSingleLine(true); setText(v.toString())
              }
              private fun page(title: String): LinearLayout {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad, pad, pad)
                  }
                  root.addView(TextView(this).apply {
                      text = title; textSize = 26f; setPadding(0, 0, 0, pad)
                  })
                  setContentView(ScrollView(this).apply { addView(root) })
                  return root
              }

              private lateinit var towerDelay: Spinner

              private fun isAccessibilityEnabled(): Boolean {
                  val enabled = Settings.Secure.getInt(contentResolver, Settings.Secure.ACCESSIBILITY_ENABLED, 0) == 1
                  if (!enabled) return false
                  val services = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
                  return services.split(':').any { it.contains(packageName, true) && it.contains("TapService", true) }
              }
              private fun needsRequirements() = !Settings.canDrawOverlays(this) || !isAccessibilityEnabled()

              private fun showHome() {
                  selectedMode = prefs.getString("mode", prefs.getString("defaultMode", "bridge")) ?: "bridge"
                  val root = page("A Helper")
                  root.addView(tv("Active mode: " + if (selectedMode == "tower") "Tower Mode" else "Bridge Mode"))
                  root.addView(btn("Bridge Mode") {
                      prefs.edit().putString("mode", "bridge").apply()
                      selectedMode = "bridge"
                      if (prefs.getBoolean("automation_running", false))
                          startService(Intent(this, OverlayService::class.java).setAction("SET_MODE"))
                      showSettings("bridge")
                  })
                  root.addView(btn("Tower Mode") {
                      selectedMode = "tower"
                      prefs.edit().putString("mode", "tower").putBoolean("auto", true).apply()
                      if (prefs.getBoolean("automation_running", false))
                          startService(Intent(this, OverlayService::class.java).setAction("SET_MODE"))
                      showHome()
                  })
                  if (needsRequirements()) root.addView(btn("Requirements — action needed") { showRequirements() })
                  val autoOn = selectedMode == "tower" || prefs.getBoolean("auto", false)
                  val autoButton = btn("Auto") {
                      if (selectedMode == "tower") {
                          // Tower Mode requires real auto-tapping; never allow its Auto state to be disabled.
                          prefs.edit().putBoolean("auto", true).apply()
                      } else {
                          val next = !prefs.getBoolean("auto", false)
                          prefs.edit().putBoolean("auto", next).putBoolean("bridge_auto", next).apply()
                      }
                      if (prefs.getBoolean("automation_running", false))
                          startService(Intent(this, OverlayService::class.java).setAction("SET_MODE"))
                      showHome()
                  }
                  autoButton.backgroundTintList = ColorStateList.valueOf(if (autoOn) Color.rgb(46, 160, 67) else Color.rgb(190, 55, 55))
                  root.addView(autoButton)
                  val running = prefs.getBoolean("automation_running", false)
                  root.addView(btn(if (running) "Stop" else "Start") {
                      if (prefs.getBoolean("automation_running", false)) {
                          startService(Intent(this, OverlayService::class.java).setAction("STOP_AUTOMATION"))
                          prefs.edit().putBoolean("automation_running", false).putString("status", "stopping").apply()
                          showHome()
                      } else if (needsRequirements()) showRequirements()
                      else startCapture(selectedMode)
                  })
                  root.addView(tv("Status: " + (prefs.getString("status", "not started") ?: "not started")))
              }

              private fun showSettings(mode: String) {
                  selectedMode = mode
                  if (mode == "tower") {
                      prefs.edit().putString("mode", "tower").putBoolean("auto", true).apply()
                      if (prefs.getBoolean("automation_running", false))
                          startService(Intent(this, OverlayService::class.java).setAction("SET_MODE"))
                      showHome()
                      return
                  }
                  prefs.edit().putString("mode", "bridge").apply()
                  val root = page("Bridge Mode")
                  if (mode == "bridge") {
                      root.addView(tv("Hold before next platform (seconds). Default: 5."))
                      holdSeconds = EditText(this).apply {
                          inputType = InputType.TYPE_CLASS_NUMBER; setSingleLine(true)
                          setText(prefs.getInt("bridge_hold_seconds", 5).toString())
                      }
                      root.addView(holdSeconds, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT))
                      root.addView(tv("Aim point (0 = near edge, 0.5 = middle, 1 = far edge)."))
                      aim = num(prefs.getFloat("bridge_aim", prefs.getFloat("aim", 0.5f)))
                      root.addView(aim, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT))
                  } else {
                      root.addView(tv("Delay after click: 0 = instant; 1 = wait one second."))
                      towerDelay = Spinner(this)
                      towerDelay.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, arrayOf("0 — Instant", "1 second — Wait"))
                      towerDelay.setSelection(prefs.getInt("tower_delay_after_click", 0).coerceIn(0, 1))
                      root.addView(towerDelay, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT))
                  }
                  if ((prefs.getString("defaultMode", "bridge") ?: "bridge") != mode) {
                      root.addView(btn("Set as Default") {
                          prefs.edit().putString("defaultMode", mode).apply()
                          showSettings(mode)
                      })
                  }
                  root.addView(btn("Save") { saveSettings(mode) })
                  root.addView(btn("Back to Main Menu") { showHome() })
              }

              private fun saveSettings(mode: String) {
                  val edit = prefs.edit()
                  if (mode == "bridge") {
                      val hold = (holdSeconds.text.toString().toIntOrNull() ?: 5).coerceIn(1, 60)
                      val a = (aim.text.toString().toFloatOrNull() ?: 0.5f).coerceIn(0f, 1f)
                      edit.putInt("bridge_hold_seconds", hold).putFloat("bridge_aim", a).putFloat("aim", a)
                  }
                  edit.apply()
                  Toast.makeText(this, "Settings saved", Toast.LENGTH_SHORT).show()
                  showSettings(mode)
              }

              private fun showRequirements() {
                  val root = page("Requirements")
                  root.addView(tv("• Android 8.0 or newer."))
                  root.addView(tv("• Enable A Helper auto-tap in Accessibility settings."))
                  root.addView(tv("• Grant display overlay permission."))
                  root.addView(tv("• Grant screen capture when prompted, then choose Entire screen."))
                  root.addView(tv("• Keep the game visible while auto-detection runs."))
                  if (!isAccessibilityEnabled()) root.addView(btn("Open Accessibility Settings") { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) })
                  if (!Settings.canDrawOverlays(this)) root.addView(btn("Grant Overlay Permission") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  })
                  root.addView(btn("Back to Main Menu") { showHome() })
              }

              private fun startCapture(requestedMode: String? = null) {
                  val mode = requestedMode ?: (prefs.getString("defaultMode", "bridge") ?: "bridge")
                  val prefix = if (mode == "bridge") "bridge_" else "tower_"
                  prefs.edit()
                      .putFloat("lead", prefs.getFloat(prefix + "lead", prefs.getFloat("lead", 100f)))
                      .putFloat("aim", prefs.getFloat(prefix + "aim", prefs.getFloat("aim", 0.5f)))
                      .putFloat("beat", prefs.getFloat(prefix + "beat", prefs.getFloat("beat", 150f)))
                      .putFloat("timedAdj", prefs.getFloat(prefix + "timedAdj", prefs.getFloat("timedAdj", 0f)))
                      .putFloat("pressX", prefs.getFloat(prefix + "pressX", prefs.getFloat("pressX", 52f)))
                      .putFloat("pressY", prefs.getFloat(prefix + "pressY", prefs.getFloat("pressY", 45f)))
                      .putBoolean("auto", if (mode == "tower") true else prefs.getBoolean("auto", false))
                      .putString("mode", mode).apply()
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Grant overlay permission first", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  val mpm = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  startActivityForResult(mpm.createScreenCaptureIntent(), 100)
              }

              override fun onResume() { super.onResume() }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req == 100 && res == RESULT_OK && data != null) {
                      prefs.edit().putBoolean("automation_running", true).putString("status", "running").apply()
                      startForegroundService(Intent(this, OverlayService::class.java)
                          .putExtra("code", res).putExtra("data", data))
                      showHome()
                  }
              }
