          cat > app/src/main/java/com/example/bridgehelper/TowerSettingsActivity.kt <<'BH_EOF'
          package com.example.bridgehelper

          import android.app.Activity
          import android.os.Bundle
          import android.view.ViewGroup.LayoutParams.WRAP_CONTENT
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.Switch
          import android.widget.Toast

          class TowerSettingsActivity : Activity() {
              private val fields = LinkedHashMap<String, EditText>()
              private lateinit var autoSw: Switch

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val p = Prefs.of(this)
                  val col = buildScreen("Tower Mode", true)
                  col.addView(chip(Ui.chipText("auto"), Ui.chipColor("auto")),
                      LinearLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT).apply { bottomMargin = dp(8) })
                  col.addView(label("Daily Tower: Fight, then Skip, then OK, again and again. Everything here is for auto taps; played by hand, the app only shows what it sees in the status line.", 13f, Ui.muted)
                      .apply { setPadding(0, 0, 0, dp(14)) })

                  val (c1, s1) = switchField("Auto tap",
                      "Taps Fight, Skip and OK for you (needs the accessibility service). Off = it only shows what it sees in the status line.",
                      p.getBoolean("auto_tower", true))
                  autoSw = s1; col.addView(c1)

                  for (o in Prefs.TOWER) {
                      val (c, et) = numberField(o, p.getFloat(o.key, o.def))
                      fields[o.key] = et; col.addView(c)
                  }
                  col.addView(bigButton("Reset to default", Ui.orange, 16f, 56) { reset() })
                  col.addView(bigButton("Save", Ui.green, 16f, 56) { save(); Toast.makeText(this, "Saved", Toast.LENGTH_SHORT).show() })
              }

              private fun save() {
                  val e = Prefs.of(this).edit()
                  for (o in Prefs.TOWER) e.putFloat(o.key, fields[o.key]!!.text.toString().toFloatOrNull() ?: o.def)
                  e.putBoolean("auto_tower", autoSw.isChecked).apply()
              }

              private fun reset() {
                  Prefs.resetTower(this)
                  for (o in Prefs.TOWER) fields[o.key]!!.setText(Prefs.fmt(o.def))
                  autoSw.isChecked = true
                  Toast.makeText(this, "Tower Mode is back to default", Toast.LENGTH_SHORT).show()
              }

              override fun onPause() { super.onPause(); save() }
          }
          BH_EOF
          mkdir -p "$(dirname app/src/main/java/com/example/bridgehelper/Ui.kt)"
          cat > app/src/main/java/com/example/bridgehelper/Ui.kt <<'BH_EOF'
          package com.example.bridgehelper

          import android.app.Activity
          import android.content.Context
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.RippleDrawable
          import android.os.Build
          import android.text.InputType
          import android.view.Gravity
          import android.view.ViewGroup.LayoutParams.MATCH_PARENT
          import android.view.ViewGroup.LayoutParams.WRAP_CONTENT
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView

          class Theme(
              val key: String, val name: String,
              val bgTop: Int, val bgBottom: Int, val card: Int, val field: Int,
              val bridge: Int, val tower: Int, val accent: Int, val start: Int
          )

          object Themes {
              private fun p(s: String) = Color.parseColor(s)

              fun all(c: Context): List<Theme> {
                  val list = mutableListOf(
                      Theme("ocean", "Ocean", p("#08182B"), p("#15416F"), p("#1B3556"), p("#102A47"), p("#2E8BEA"), p("#7C5CE0"), p("#1FA89A"), p("#2EBD59")),
                      Theme("sunset", "Sunset", p("#2B1020"), p("#8A3B2E"), p("#4B2234"), p("#321423"), p("#F2762E"), p("#D6409F"), p("#FFB347"), p("#E8912B")),
                      Theme("forest", "Forest", p("#07201A"), p("#1B5E43"), p("#1F4A3A"), p("#123528"), p("#2EBD8A"), p("#8BC34A"), p("#26A69A"), p("#3DBE5B")),
                      Theme("violet", "Violet", p("#160B2E"), p("#4B2A8A"), p("#3A2470"), p("#26154D"), p("#8E6CF0"), p("#E04FD0"), p("#5C6BF0"), p("#7C4DFF")),
                      Theme("midnight", "Midnight", p("#05070D"), p("#101826"), p("#151E2E"), p("#0C121D"), p("#22B8D4"), p("#6EA8FE"), p("#14B8A6"), p("#0EA5C6"))
                  )
                  if (Build.VERSION.SDK_INT >= 31) {
                      fun col(id: Int) = c.resources.getColor(id, c.theme)
                      list.add(Theme("wallpaper", "Wallpaper colours",
                          col(android.R.color.system_neutral1_900), col(android.R.color.system_accent1_800),
                          col(android.R.color.system_accent2_700), col(android.R.color.system_neutral1_800),
                          col(android.R.color.system_accent1_400), col(android.R.color.system_accent3_400),
                          col(android.R.color.system_accent2_300), col(android.R.color.system_accent1_500)))
                  }
                  return list
              }

              fun byKey(c: Context, key: String): Theme = all(c).firstOrNull { it.key == key } ?: all(c)[0]
          }

          /** Colours of the current theme. green / orange / red keep their meaning in every theme. */
          object Ui {
              var themeKey = "ocean"
              var bgTop = Color.parseColor("#08182B")
              var bgBottom = Color.parseColor("#15416F")
              var card = Color.parseColor("#1B3556")
              var field = Color.parseColor("#102A47")
              var blue = Color.parseColor("#2E8BEA")      // Bridge accent
              var purple = Color.parseColor("#7C5CE0")    // Tower accent
              var teal = Color.parseColor("#1FA89A")      // secondary accent
              var start = Color.parseColor("#2EBD59")     // Start button
              val muted = Color.parseColor("#9FB4CC")
              val green = Color.parseColor("#2EBD59")
              val orange = Color.parseColor("#F29A2E")
              val red = Color.parseColor("#E5484D")

              fun load(c: Context) {
                  val key = c.getSharedPreferences("p", Context.MODE_PRIVATE).getString("theme", "ocean") ?: "ocean"
                  val t = Themes.byKey(c, key)
                  themeKey = t.key; bgTop = t.bgTop; bgBottom = t.bgBottom; card = t.card; field = t.field
                  blue = t.bridge; purple = t.tower; teal = t.accent; start = t.start
              }

              /** t of colour a, the rest of colour b. */
              fun mix(a: Int, b: Int, t: Float): Int = Color.rgb(
                  (Color.red(a) * t + Color.red(b) * (1 - t)).toInt(),
                  (Color.green(a) * t + Color.green(b) * (1 - t)).toInt(),
                  (Color.blue(a) * t + Color.blue(b) * (1 - t)).toInt())

              fun chipText(tab: String) = when (tab) { "manual" -> "MANUAL ONLY"; "auto" -> "AUTO ONLY"; else -> "BOTH" }
              fun chipColor(tab: String) = when (tab) { "manual" -> orange; "auto" -> blue; else -> teal }
          }

          fun Activity.dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

          fun Activity.rounded(color: Int, radiusDp: Int): GradientDrawable =
              GradientDrawable().apply { setColor(color); cornerRadius = dp(radiusDp).toFloat() }

          fun Activity.rippleBg(color: Int, radiusDp: Int): RippleDrawable =
              RippleDrawable(ColorStateList.valueOf(0x44FFFFFF), rounded(color, radiusDp), null)

          fun Activity.label(text: String, sizeSp: Float, color: Int = Color.WHITE, bold: Boolean = false): TextView =
              TextView(this).apply {
                  this.text = text; textSize = sizeSp; setTextColor(color)
                  if (bold) typeface = Typeface.DEFAULT_BOLD
              }

          fun Activity.chip(text: String, color: Int): TextView = TextView(this).apply {
              this.text = text; textSize = 10f; setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD
              background = rounded(color, 8); setPadding(dp(8), dp(3), dp(8), dp(3))
          }

          fun Activity.bigButton(text: String, color: Int, sizeSp: Float = 18f, heightDp: Int = 64, onClick: () -> Unit): TextView =
              TextView(this).apply {
                  this.text = text; textSize = sizeSp; setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD
                  gravity = Gravity.CENTER
                  background = rippleBg(color, 16)
                  isClickable = true
                  setOnClickListener { onClick() }
                  layoutParams = LinearLayout.LayoutParams(MATCH_PARENT, dp(heightDp)).apply { bottomMargin = dp(12) }
              }

          /** A square button with a white icon (gear, palette). */
          fun Activity.iconButton(resId: Int, color: Int, sizeDp: Int, onClick: () -> Unit): ImageView =
              ImageView(this).apply {
                  setImageResource(resId)
                  scaleType = ImageView.ScaleType.FIT_CENTER
                  setPadding(dp(sizeDp / 4), dp(sizeDp / 4), dp(sizeDp / 4), dp(sizeDp / 4))
                  background = rippleBg(color, 16)
                  isClickable = true
                  setOnClickListener { onClick() }
                  layoutParams = LinearLayout.LayoutParams(dp(sizeDp), dp(sizeDp))
              }

          /** A themed gradient screen with a title (and a back arrow). Returns the column to add content to. */
          fun Activity.buildScreen(title: String, showBack: Boolean): LinearLayout {
              Ui.load(this)
              val column = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  setPadding(dp(20), dp(16), dp(20), dp(28))
              }
              if (title.isNotEmpty()) {
                  val header = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                  if (showBack) header.addView(label("\u2039", 34f).apply {
                      setPadding(0, 0, dp(14), dp(4)); setOnClickListener { finish() }
                  })
                  header.addView(label(title, 24f, bold = true))
                  column.addView(header, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { bottomMargin = dp(16) })
              }
              val scroll = ScrollView(this).apply {
                  background = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(Ui.bgTop, Ui.bgBottom))
                  isFillViewport = true
                  addView(column)
              }
              window.statusBarColor = Ui.bgTop
              window.navigationBarColor = Ui.bgBottom
              setContentView(scroll)
              return column
          }

          fun Activity.card(): LinearLayout = LinearLayout(this).apply {
              orientation = LinearLayout.VERTICAL
              background = rounded(Ui.card, 14)
              setPadding(dp(16), dp(14), dp(16), dp(14))
              layoutParams = LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { bottomMargin = dp(12) }
          }

          fun Activity.sectionTitle(text: String): TextView = label(text, 12f, Ui.muted, true).apply {
              setPadding(dp(4), dp(8), 0, dp(8)); letterSpacing = 0.1f
          }

          /** A number setting. The chip in the corner says whether it is for manual play, auto, or both. */
          fun Activity.numberField(opt: Prefs.Opt, value: Float): Pair<LinearLayout, EditText> {
              val c = card()
              val head = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
              head.addView(label(opt.title, 16f, bold = true), LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
              head.addView(chip(Ui.chipText(opt.tab), Ui.chipColor(opt.tab)))
              c.addView(head)
              c.addView(label(opt.desc, 12f, Ui.muted).apply { setPadding(0, dp(2), 0, dp(8)) })
              val et = EditText(this).apply {
                  inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL or InputType.TYPE_NUMBER_FLAG_SIGNED
                  setText(Prefs.fmt(value)); setTextColor(Color.WHITE); textSize = 18f
                  background = rounded(Ui.field, 10); setPadding(dp(14), dp(10), dp(14), dp(10))
              }
              c.addView(et, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT))
              return c to et
          }

          fun Activity.switchField(title: String, desc: String, checked: Boolean, chipTab: String? = null): Pair<LinearLayout, Switch> {
              val c = card()
              if (chipTab != null)
                  c.addView(chip(Ui.chipText(chipTab), Ui.chipColor(chipTab)),
                      LinearLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT).apply { bottomMargin = dp(8) })
              val sw = Switch(this).apply {
                  text = title; isChecked = checked; setTextColor(Color.WHITE); textSize = 16f; typeface = Typeface.DEFAULT_BOLD
              }
              c.addView(sw, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT))
              c.addView(label(desc, 12f, Ui.muted).apply { setPadding(0, dp(6), 0, 0) })
              return c to sw
          }
