          class RequirementsActivity : Activity() {
              private lateinit var list: LinearLayout

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val col = buildScreen("Requirements", true)
                  col.addView(label("A green tick means it is ready.", 13f, Ui.muted).apply { setPadding(0, 0, 0, dp(14)) })
                  list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  col.addView(list)
              }

              override fun onResume() { super.onResume(); fill() }

              private fun section(text: String) {
                  list.addView(label(text, 13f, Ui.muted, true).apply { setPadding(dp(2), dp(6), 0, dp(8)) })
              }

              /** required rows show a red "Needed"; optional rows only say "Optional" until they are set. */
              private fun row(title: String, desc: String, ok: Boolean?, required: Boolean, button: String?, action: (() -> Unit)?) {
                  val c = card()
                  val head = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  head.addView(label(title, 16f, bold = true), LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  if (ok != null) {
                      val text = if (ok) "\u2713 Ready" else if (required) "\u2717 Needed" else "Optional"
                      val color = if (ok) Color.parseColor("#4CE07A") else if (required) Color.parseColor("#FF7B7B") else Ui.muted
                      head.addView(label(text, 14f, color, true))
                  }
                  c.addView(head)
                  c.addView(label(desc, 12f, Ui.muted).apply { setPadding(0, dp(4), 0, dp(if (button != null) 10 else 0)) })
                  if (button != null && action != null) {
                      val btn = bigButton(button, if (ok == true) Ui.req else Ui.accent, 14f, 46) { action() }
                      (btn.layoutParams as LinearLayout.LayoutParams).bottomMargin = 0
                      c.addView(btn)
                  }
                  list.addView(c)
              }

              private fun fill() {
                  list.removeAllViews()
                  list.addView(sectionTitle("REQUIRED"))

                  row("Display over other apps", "Lets OL Helper draw the guide on top of the game.",
                      Settings.canDrawOverlays(this), "Open setting") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  }

                  row("Accessibility service", "Lets OL Helper press and release the screen for you. In Accessibility open Downloaded apps, tap OL Helper auto-tap and turn it on. If the switch is greyed out, allow restricted settings (see Optional below).",
                      Prefs.accessibilityOn(this), "Open accessibility settings") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }

                  list.addView(sectionTitle("OPTIONAL"))

                  row("Allow restricted settings", "If the accessibility switch is greyed out: open App info, tap the three dots at the top right and choose Allow restricted settings.",
                      null, "Open app info") {
                      startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:$packageName")))
                  }

                  val notifOk = Build.VERSION.SDK_INT < 33 ||
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED
                  row("Notifications", "Shows the live status and the Auto on/off button while OL Helper runs.",
                      notifOk, "Allow notifications") {
                      if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 2)
                  }

                  val pm = getSystemService(POWER_SERVICE) as PowerManager
                  row("Battery: no restrictions", "Stops the phone from shutting OL Helper down in the background. Also turn on Autostart for it in the app settings.",
                      pm.isIgnoringBatteryOptimizations(packageName), "Open battery settings") {
                      startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                  }

                  row("Screen capture", "Android asks every time you press Start. Choose Entire screen, not a single app.", null, null, null)

                  row("Keep it from being turned off", "On Xiaomi / Poco phones, clearing recent apps turns accessibility services off. Open Recents, press and hold the OL Helper card and tap the lock icon. Installing an update also turns the service off, so switch it on again afterwards.",
                      null, null, null)
              }
          }
