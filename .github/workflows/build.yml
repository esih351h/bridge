          cat > app/src/main/java/com/example/bridgehelper/TapService.kt <<'BH_EOF'
          package com.example.bridgehelper

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent

          /** Does nothing by itself: OverlayService asks it to press and release the screen when Auto is on. */
          class TapService : AccessibilityService() {
              companion object { @Volatile var instance: TapService? = null }

              private var stroke: GestureDescription.StrokeDescription? = null
              private var px = 0f; private var py = 0f

              override fun onServiceConnected() { instance = this }
              override fun onUnbind(intent: Intent?): Boolean { instance = null; return super.onUnbind(intent) }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() { stroke = null }

              /** A quick single tap at (x, y). */
              fun tap(x: Float, y: Float): Boolean {
                  val s = GestureDescription.StrokeDescription(Path().apply { moveTo(x, y) }, 0, 60)
                  return dispatchGesture(GestureDescription.Builder().addStroke(s).build(), null, null)
              }

              /** One press of a fixed length: the system lifts the finger by itself, so nothing can get stuck. */
              fun holdFor(x: Float, y: Float, ms: Long): Boolean {
                  val st = GestureDescription.StrokeDescription(Path().apply { moveTo(x, y) }, 0, if (ms < 40L) 40L else ms)
                  return dispatchGesture(GestureDescription.Builder().addStroke(st).build(), null, null)
              }

              /** Presses at (x, y) and keeps holding until release() is called. */
              fun press(x: Float, y: Float): Boolean {
                  px = x; py = y
                  val s = GestureDescription.StrokeDescription(Path().apply { moveTo(x, y) }, 0, 80, true)
                  stroke = s
                  val ok = dispatchGesture(GestureDescription.Builder().addStroke(s).build(),
                      object : AccessibilityService.GestureResultCallback() {
                          override fun onCancelled(gestureDescription: GestureDescription?) { if (stroke === s) stroke = null }
                      }, null)
                  if (!ok) stroke = null
                  return ok
              }

              /** Lifts the finger that press() put down. */
              fun release() {
                  val s = stroke ?: return
                  stroke = null
                  val c = s.continueStroke(Path().apply { moveTo(px, py) }, 0, 20, false)
                  dispatchGesture(GestureDescription.Builder().addStroke(c).build(), null, null)
              }
          }
          BH_EOF
