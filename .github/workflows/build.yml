          package com.example.bridgehelper

          import android.app.Activity
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup.LayoutParams.MATCH_PARENT
          import android.view.ViewGroup.LayoutParams.WRAP_CONTENT
          import android.widget.LinearLayout

          class ThemesActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val col = buildScreen("Themes", true)
                  col.addView(label("Pick a look. It applies everywhere in OL Helper. Green, red and amber keep their meaning in every theme.", 13f, Ui.muted)
                      .apply { setPadding(0, 0, 0, dp(14)) })
                  val current = Prefs.of(this).getString("theme", "ocean")
                  for (t in Themes.all(this)) col.addView(themeCard(t, t.key == current))
              }

              private fun dot(color: Int): View = View(this).apply {
                  background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(color) }
                  layoutParams = LinearLayout.LayoutParams(dp(24), dp(24)).apply { leftMargin = dp(8) }
              }

              private fun themeCard(t: Theme, selected: Boolean): LinearLayout {
                  val c = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      background = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(t.bgTop, t.bgBottom)).apply {
                          cornerRadius = dp(16).toFloat()
                          if (selected) setStroke(dp(3), Color.WHITE)
                      }
                      setPadding(dp(18), dp(18), dp(18), dp(18))
                      layoutParams = LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { bottomMargin = dp(12) }
                      isClickable = true
                      setOnClickListener {
                          Prefs.of(this@ThemesActivity).edit().putString("theme", t.key).apply()
                          recreate()
                      }
                  }
                  c.addView(label(t.name + (if (selected) "   \u2713" else ""), 17f, bold = true), LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                  for (colr in listOf(t.bridge, t.tower, t.accent, t.start)) c.addView(dot(colr))
                  return c
              }
          }
